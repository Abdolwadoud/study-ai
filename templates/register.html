<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Study AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            background: #151c32;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aab3cc;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #303a59;
            border-radius: 10px;
            background: #0e1528;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #4f7cff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .message {
            background: #2a2030;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #aab3cc;
        }

        a {
            color: #7da2ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>إنشاء حساب</h1>

    <div class="subtitle">
        أنشئ حسابك في Study AI
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="📧 البريد الإلكتروني"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="🔒 كلمة المرور"
            minlength="8"
            required
        >

        <button type="submit">
            إنشاء الحساب
        </button>

    </form>

    <div class="login">
        لديك حساب بالفعل؟
        <a href="{{ url_for('auth.login') }}">
            تسجيل الدخول
        </a>
    </div>

</div>

</body>
</html>
