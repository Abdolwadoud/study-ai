<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>التحقق - Study AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            background: #151c32;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aab3cc;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #303a59;
            border-radius: 10px;
            background: #0e1528;
            color: white;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #4f7cff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .message {
            background: #2a2030;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔐 التحقق من الحساب</h1>

    <div class="subtitle">
أدخل رمز التحقق المكوّن من 6 أرقام
الذي وصلك عبر البريد الإلكتروني.
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input
            type="text"
            name="code"
            placeholder="000000"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
            required
        >

        <button type="submit">
            تأكيد الرمز
        </button>

    </form>

</div>

</body>
</html>
